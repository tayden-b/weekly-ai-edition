<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2500" viewBox="0 0 2000 2500">
  
  <filter id="soft"><feGaussianBlur stdDeviation="36"/></filter>
  <rect width="2000" height="2500" fill="#F1EDE3"/>
  <g filter="url(#soft)"><ellipse cx="1112.2" cy="1249.14" rx="715.34" ry="1316.58" fill="#E7DFCA" opacity="0.81"/><ellipse cx="1264.65" cy="1313.45" rx="1188.78" ry="834.22" fill="#DCCFB2" opacity="0.86"/><ellipse cx="1510.54" cy="759.44" rx="835.82" ry="1424.45" fill="#CABD9D" opacity="0.74"/><ellipse cx="558.18" cy="735.41" rx="999.06" ry="820.35" fill="#B4A586" opacity="0.86"/><ellipse cx="340.45" cy="1525.61" rx="220" ry="225" fill="#B86038" opacity="0.72"/></g>
  
  <linearGradient id="light" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <rect width="2000" height="2500" fill="url(#light)"/>
  
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="47510" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.05" intercept="0"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
    <stop offset="62%" stop-color="black" stop-opacity="0"/>
    <stop offset="100%" stop-color="black" stop-opacity="0.10"/>
  </radialGradient>
  <rect width="2000" height="2500" filter="url(#grain)"/>
  <rect width="2000" height="2500" fill="url(#vignette)"/>
</svg>
