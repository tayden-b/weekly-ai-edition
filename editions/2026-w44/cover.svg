<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2500" viewBox="0 0 2000 2500">
  
  <filter id="soft"><feGaussianBlur stdDeviation="52"/></filter>
  <rect width="2000" height="2500" fill="#F1EDE3"/>
  <g filter="url(#soft)"><ellipse cx="1439.15" cy="2253.96" rx="855.95" ry="1327.05" fill="#E7DFCA" opacity="0.93"/><ellipse cx="273.65" cy="509.72" rx="815.1" ry="1435.67" fill="#DCCFB2" opacity="0.72"/><ellipse cx="1648.72" cy="2099.19" rx="927.08" ry="1440.34" fill="#CABD9D" opacity="0.65"/><ellipse cx="315.36" cy="1750.67" rx="220" ry="225" fill="#B86038" opacity="0.72"/></g>
  
  <linearGradient id="light" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <rect width="2000" height="2500" fill="url(#light)"/>
  
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="39045" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.09" intercept="0"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
    <stop offset="62%" stop-color="black" stop-opacity="0"/>
    <stop offset="100%" stop-color="black" stop-opacity="0.10"/>
  </radialGradient>
  <rect width="2000" height="2500" filter="url(#grain)"/>
  <rect width="2000" height="2500" fill="url(#vignette)"/>
</svg>
