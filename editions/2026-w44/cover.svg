<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2500" viewBox="0 0 2000 2500">
  
  <filter id="soft"><feGaussianBlur stdDeviation="47"/></filter>
  <rect width="2000" height="2500" fill="#EEF0EB"/>
  <g filter="url(#soft)"><ellipse cx="308.08" cy="1271.8" rx="1169.34" ry="991.36" fill="#E0E5DD" opacity="0.64"/><ellipse cx="942.6" cy="378.83" rx="1109.3" ry="1144.23" fill="#CCD5C6" opacity="0.91"/><ellipse cx="274.25" cy="1943.79" rx="1238.28" ry="849.53" fill="#B4C1AC" opacity="0.89"/><ellipse cx="825.16" cy="427.9" rx="845.12" ry="1153.25" fill="#9DAE96" opacity="0.85"/><ellipse cx="1604.93" cy="1736.83" rx="220" ry="225" fill="#B4653C" opacity="0.72"/></g>
  
  <linearGradient id="light" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <rect width="2000" height="2500" fill="url(#light)"/>
  
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="53749" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
