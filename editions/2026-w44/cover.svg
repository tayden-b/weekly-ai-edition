<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2500" viewBox="0 0 2000 2500">
  
  <filter id="soft"><feGaussianBlur stdDeviation="49"/></filter>
  <rect width="2000" height="2500" fill="#F3EEE7"/>
  <g filter="url(#soft)"><ellipse cx="1648.23" cy="1538.08" rx="988.08" ry="1376.32" fill="#E8DCCD" opacity="0.66"/><ellipse cx="581.72" cy="2276.85" rx="912.88" ry="1189.9" fill="#D7C4AC" opacity="0.75"/><ellipse cx="1352.94" cy="1144.06" rx="800.74" ry="788.21" fill="#C2A78A" opacity="0.83"/><ellipse cx="1511.81" cy="1669.62" rx="220" ry="225" fill="#AE4A2E" opacity="0.72"/></g>
  
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <rect width="2000" height="2500" fill="url(#light)"/>
  
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="28570" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.07" intercept="0"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
    <stop offset="62%" stop-color="black" stop-opacity="0"/>
    <stop offset="100%" stop-color="black" stop-opacity="0.10"/>
  </radialGradient>
  <rect width="2000" height="2500" filter="url(#grain)"/>
  <rect width="2000" height="2500" fill="url(#vignette)"/>
</svg>
