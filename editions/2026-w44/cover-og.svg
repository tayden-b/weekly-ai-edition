<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  
  <filter id="soft"><feGaussianBlur stdDeviation="36"/></filter>
  <rect width="1200" height="630" fill="#F1EDE3"/>
  <g filter="url(#soft)"><ellipse cx="667.32" cy="314.78" rx="429.2" ry="331.78" fill="#E7DFCA" opacity="0.81"/><ellipse cx="758.79" cy="330.99" rx="713.27" ry="210.22" fill="#DCCFB2" opacity="0.86"/><ellipse cx="906.33" cy="191.38" rx="501.49" ry="358.96" fill="#CABD9D" opacity="0.74"/><ellipse cx="334.91" cy="185.32" rx="599.43" ry="206.73" fill="#B4A586" opacity="0.86"/><ellipse cx="204.27" cy="384.45" rx="132" ry="56.7" fill="#B86038" opacity="0.72"/></g>
  
  <linearGradient id="light" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <rect width="1200" height="630" fill="url(#light)"/>
  
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="47510" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.05" intercept="0"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
    <stop offset="62%" stop-color="black" stop-opacity="0"/>
    <stop offset="100%" stop-color="black" stop-opacity="0.10"/>
  </radialGradient>
  <rect width="1200" height="630" filter="url(#grain)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
