<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  
  <filter id="soft"><feGaussianBlur stdDeviation="49"/></filter>
  <rect width="1200" height="630" fill="#F3EEE7"/>
  <g filter="url(#soft)"><ellipse cx="988.94" cy="387.6" rx="592.85" ry="346.83" fill="#E8DCCD" opacity="0.66"/><ellipse cx="349.03" cy="573.77" rx="547.73" ry="299.86" fill="#D7C4AC" opacity="0.75"/><ellipse cx="811.76" cy="288.3" rx="480.45" ry="198.63" fill="#C2A78A" opacity="0.83"/><ellipse cx="907.08" cy="420.74" rx="132" ry="56.7" fill="#AE4A2E" opacity="0.72"/></g>
  
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <rect width="1200" height="630" fill="url(#light)"/>
  
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="28570" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.07" intercept="0"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
    <stop offset="62%" stop-color="black" stop-opacity="0"/>
    <stop offset="100%" stop-color="black" stop-opacity="0.10"/>
  </radialGradient>
  <rect width="1200" height="630" filter="url(#grain)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
