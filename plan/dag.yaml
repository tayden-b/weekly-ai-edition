# plan/dag.yaml — the build DAG / state machine (PLAN.md §7.2).
# dispatch.mjs promotes a `status:blocked` issue to `devin:ready` when every
# depends_on issue is closed. `status: deferred` items (T3) are never promoted
# and are not required for completion. `issue` is written back when B0 creates
# the issues; S1's issue is also created by B0 — the separate `v1-complete`
# issue is opened by dispatch once every item is closed, carrying the S1 brief.
version: 1
