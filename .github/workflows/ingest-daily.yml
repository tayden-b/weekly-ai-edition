name: ingest-daily
on:
  # 06:00 ET ≈ 11:00 UTC — GitHub cron is UTC-only, so this lands 06:00 ET
  # while EST is in effect (Nov–Mar) and 07:00 ET during EDT (Mar–Nov). The
  # daily run just keeps the raw cache warm (PLAN §5.2), so the DST drift is
  # tolerated rather than corrected.
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: # manual ingest — also how P3's proof run is produced

permissions:
  contents: write # push the ingest branch + merge its PR
  pull-requests: write # open the ingest PR — main is protected, so the
  # commit-back lands through an auto-merge PR (git-as-CMS, ADR-0001)

# one ingest at a time — a dispatch overlapping the cron run queues instead of
# racing the commit-back to main (the pull --rebase would cover it, but a
# queued re-run is cleaner than a resolved race).
concurrency:
  group: ingest-daily
  cancel-in-progress: false

jobs:
  ingest:
    name: ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ingest
        env:
          # github-releases adapter auth — without it the run rides the
          # 60 req/hr unauthenticated budget of the shared runner egress IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the raw cache back via auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "no diff — re-run was idempotent, nothing to commit"
            exit 0
          fi
          branch="ingest/$(date -u +%F)-run${{ github.run_id }}"
          git checkout -b "$branch"
          git commit \
            -m "ingest: data/raw/$(date -u +%F)" \
            -m "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push -u origin "$branch"
          gh pr create \
            --title "ingest: data/raw/$(date -u +%F)" \
            --body "Automated daily ingest of \`data/raw\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --base main --head "$branch"
          gh pr merge --auto --squash "$branch" \
            || echo "auto-merge unavailable — Supervisor merges on green"
