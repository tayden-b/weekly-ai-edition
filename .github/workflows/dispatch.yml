name: dispatch
on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    name: dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promote unblocked issues
        run: node scripts/dispatch.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
