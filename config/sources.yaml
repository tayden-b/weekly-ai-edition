# config/sources.yaml — the PLAN §5.1 verified-source table as data.
#
# ONE ENTRY PER PUBLISHER SOURCE. A-items (adapters) add entries, never
# reshape this schema. If a field is missing for a source, the narrowest
# sane value goes in `meta`, not a new top-level field.
#
# Entry schema (enforced by packages/pipeline/src/config.ts):
#   id         unique slug, e.g. "openai-news"
#   pages      template pages this source feeds (slugs: models, performance,
#              launches, funding, deals, markets, discourse; derived pages —
#              cover, briefing, most_covered, back_page — take no sources)
#   tier       primary | secondary   (secondary = corroboration only)
#   adapter    adapter implementation id → src/sources/<adapter>.ts
#   endpoint   feed/API/index URL the adapter fetches
#   kind       rss | atom | json-api | graphql | csv | sitemap | html-index
#   license    licence/ToS note: posture + exactly what we store
#   rate_limit courtesy limit the adapter honours
#   enabled    ingest may use it (false = documented-off, never a failure)
#   mode       data | link  (optional; "link" = headline+link only, ToS-doubtful)
#   meta       adapter-specific config: repos, orgs, subreddits, filter terms
#
# Universal storage rule (§5.1): headline, canonical URL, publisher,
# published_at, fetched_at, excerpt ≤300 chars, source ids — NEVER bodies.
# UA: weekly-ai-edition/<ver> (+https://github.com/tayden-b/weekly-ai-edition).

