  # =========================================================================
  # Funding + Deals — SEC EDGAR (A4), press wires (A5)
  # =========================================================================
  - id: sec-edgar-fts
    pages: [funding, deals]
    tier: primary
    adapter: sec-edgar
    endpoint: https://efts.sec.gov/LATEST/search-index
    kind: json-api
    license: "Official SEC data, public domain. Fair-access rules: declared UA 'Name email', ≤10 req/s. Store accession no., form, filer."
    rate_limit: "≤10 req/s (SEC fair access)"
    enabled: true
    meta:
      forms: [D, S-1, 8-K]
      # A4: 8-K Item 1.01/2.01 for Deals; full-text search over filing text.
      items_8k: ["1.01", "2.01"]
      # AI filter terms — OR'd into the FTS `q`. Interim list until the C3
      # taxonomy lands; same key as hn-algolia.meta.ai_terms (A2 shares it).
