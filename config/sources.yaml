  # an item survives iff EVERY group has >=1 word-boundary, case-insensitive
  # hit. The firehose wires carry {ai, funding_ma} = PLAN's "'artificial
  # intelligence' + 'funding' filters". Feeds already scoped to funding or to
  # AI by the publisher (TechCrunch funding, Crunchbase News, Guardian AI)
  # carry only the complementary group or none. Term lists derive from the
  # page taxonomy (C3); this is a recall filter — classify (P4) decides
  # page/unsorted downstream. YAML anchors share the lists across wires.
