# config/companies.yaml — the company registry (PLAN §5.3).
#
# Company tags on edition items MUST resolve to a slug here; an unknown
# company goes to `unsorted`, never auto-added. Seed set: the Markets
# basket + the major AI labs + their parents.
#
# Entry schema (enforced by packages/pipeline/src/config.ts):
#   slug     lowercase slug — the tag value, e.g. "openai"
#   name     display name
#   aliases  other names/spans that map to this slug (optional)
#   domain   primary domain (optional; aids entity resolution)
#   ticker   public ticker if listed (optional; labs under parents carry the
#            parent's ticker so Markets ↔ lab linkage is explicit)

companies:
  # --- Markets basket -------------------------------------------------------
  - slug: nvidia
    name: NVIDIA
    aliases: [NVDA]
    domain: nvidia.com
    ticker: NVDA
  - slug: microsoft
    name: Microsoft
    aliases: [MSFT]
    domain: microsoft.com
    ticker: MSFT
